name: Build SparkPoints

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build cu Maven
        run: mvn -B clean package

      - name: Salveaza jar-ul
        uses: actions/upload-artifact@v4
        with:
          name: SparkPoints
          path: target/*.jar
